[package]
name = "__NAME__"
version = "0.1.0"
edition = "2021"
description = "__DESC__"

[dependencies]
taskbar-dock = { path = "../taskbar-dock" }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
