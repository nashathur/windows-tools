[package]
name = "taskbar-dock"
version = "0.1.0"
edition = "2021"
description = "Shared settings, style, Windows-settings reading and taskbar docking for the taskbar widgets"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# UI Automation (COM) for the taskbar's app buttons (icons.rs), and Direct2D/DirectWrite for colour
# emoji (emoji.rs); windows-sys can't call COM.
# Same version as taskbar-weather and taskbar-media, so they share one build of it.
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }

# Edit-loop profile for dev.ps1: tests always, the widget too with -Fast. No LTO, parallel
# codegen and incremental, so a small change rebuilds in seconds. `release` stays the small final build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
