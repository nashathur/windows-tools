[package]
name = "taskbar-dock-settings"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "taskbar-dock-settings"
path = "src/main.rs"

[dependencies]
taskbar-dock = { path = ".." }
windows-reactor = "=0.100.0"
serde_json = "1"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Time",
    "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"
] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
    "Win32_System_Threading", "UI_ViewManagement"
] }

[patch.crates-io]
windows-reactor = { path = "vendor/windows-reactor" }
