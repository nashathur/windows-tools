[package]
name = "sysmon-temp"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "sysmon-temp"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
