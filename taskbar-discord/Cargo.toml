[package]
name = "taskbar-discord"
version = "0.1.0"
edition = "2021"
description = "Discord voice chat on the Windows taskbar (Discord's local RPC)"

[dependencies]
taskbar-dock = { path = "../taskbar-dock" }   # shared settings, style, Windows settings, docking
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
png = "0.17"   # avatars from Discord's CDN (requested as PNG)

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Edit-loop profile for dev.ps1: tests always, the widget too with -Fast. No LTO, parallel
# codegen and incremental, so a small change rebuilds in seconds. `release` stays the small final build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
