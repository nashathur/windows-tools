[package]
name = "taskbar-media"
version = "0.1.0"
edition = "2021"
description = "Now playing on the Windows taskbar (Windows media sessions)"

[dependencies]
taskbar-dock = { path = "../taskbar-dock" }   # shared settings, style, Windows settings, docking
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Edit-loop profile for dev.ps1: tests always, the widget too with -Fast. No LTO, parallel
# codegen and incremental, so a small change rebuilds in seconds. `release` stays the small final build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
